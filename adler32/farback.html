<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<title>Farback Device | The Adler Tapes</title>
	</head>
	<style>
		body {
			margin: 0;
			width: 100%;
			height: 100%;
			font-family: sans-serif;
			font-size: 10pt;
		}
		div#farback {
			display: flex;
			width: 100%;
			height: 100%;
			flex-direction: column;
		}
		div#farback-header {
			display: flex;
			margin-left: 6px;
			margin-right: 6px;
			padding-left: 3px;
			padding-right: 3px;
			border-left: 5px solid black;
			border-right: 5px solid black;
			border-bottom: 5px solid black;
			border-bottom-left-radius: 10px;
			border-bottom-right-radius: 10px;
			box-shadow: 1px 1px 3px #333;
			align-items: center;
			justify-content: center;
		}
		div#farback-main {
			padding: 4px;
			display: flex;
			flex: 1;
			gap: 4px;
			flex-wrap: wrap;
		}
		div.farback-line {
			display: flex;
			width: 100%;
			gap: 4px;
		}
		div.farback-line a {
			color: blue;
		}
		div.farback-line span {
			color: gray;
			font-size: 8pt;
		}
		input#farback-entry {
			flex: 1;
		}
		button#farback-go {
			border: 1px solid black;
			padding-left: 10px;
			padding-right: 10px;
			background-color: white;
			cursor: pointer;
		}
		button#farback-go:hover {
			background-color: #eee;
		}
		div#farback-selection-middle {
			display: inline-block;
			background-color: black;
			height: 100%;
			padding-left: 4px;
			padding-right: 4px;
			color: yellow;
		}
		iframe#farback-embed {
			display: inline-block;
			flex-grow: 1;
			border: none;
			padding: 0px;
			margin: 0px;
			width: 100%;
			height: 600px;
		}
	</style>
	<body>
	<div id="farback">
		<div id="farback-header">
			<a href=""><img src="farback.png"/></a>
			<div id="farback-main">
				<div class="farback-line">
					<input id="farback-entry" type="text"></input>
					<button id="farback-go" onClick="setUrl();">Go</button>
				</div>
				<div class="farback-line"><a href="">1 capture</a></div>
				<div class="farback-line"><span>17 Apr 2005 - 17 Apr 2005</span></div>
			</div>
			<div id="farback-selection-middle"><b>
				<span style="font-size: 11pt;">APR</span><br>
				<span style="font-size: 18pt;">17</span><br>
				<span style="font-size: 9pt;">2005</span>
			</b></div>
			</div>
		</div>
		<iframe id="farback-embed"></iframe>
	</div>
	</body>
	<script>
		const elem_farback_header = document.getElementById('farback-header');
		const elem_farback_entry = document.getElementById('farback-entry');
		const elem_farback_embed = document.getElementById('farback-embed');

		const url_params = new URLSearchParams(window.location.search);
		var load_url = url_params.get('load_url');

		if (load_url === null) {
			load_url = 'index.html';
		}
		const base_url = 'https://www.111adlerfm.com/';

		elem_farback_entry.value = base_url+load_url;
		elem_farback_embed.src = load_url;

		function setUrl() {

			url = elem_farback_entry.value;
			if (url.startsWith(base_url)) {

				url = url.substring(base_url.length);
				location.assign('farback.html?load_url='+url);
			}
		}

		function resizeEmbed() {

			var height = window.innerHeight;
			height -= elem_farback_header.offsetHeight;

			elem_farback_embed.style.height = height+'px';
		}
		resizeEmbed();

		window.addEventListener('resize', (e) => { resizeEmbed(); });
	</script>
</html>
